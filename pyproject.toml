[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-troubleshooter"
description = "Track and troubleshoot internet performance using ping, traceroute, and the Speedtest CLI."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dynamic = ["version"]

authors = [
    { name = "Bryant Nelson", email = "bryantstutoringservice@gmail.com" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
html = ["plotly>=5.0,<7"]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    # Current mypy releases require 3.10+, so the 3.9 leg of the test matrix
    # goes without it. Type checking runs as its own job on a newer Python.
    "mypy; python_version >= '3.10'",
    "types-PyYAML; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/bethune-bryant/internet-troubleshooter"

[project.scripts]
checkinternet = "internet_troubleshooter.checkinternet:main"

[tool.setuptools.dynamic]
version = { attr = "internet_troubleshooter.__version__" }

[tool.setuptools.packages.find]
include = ["internet_troubleshooter*"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
source = ["internet_troubleshooter"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
# E203 (whitespace before ':') conflicts with the formatter's slice style.
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Holds verbatim `ping` output as test fixtures, which must not be rewrapped.
"test/test_ping_test.py" = ["E501"]

[tool.mypy]
files = ["internet_troubleshooter"]
strict = true
# plotly is an optional dependency and ships no stubs, so its imports resolve
# to Any rather than failing the run on machines without the html extra.
ignore_missing_imports = true
