# This workflow will install Python dependencies, run tests and lint across supported Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,html]"
    - name: Lint with ruff
      run: |
        ruff check --output-format=full .
    - name: Check formatting with ruff
      run: |
        ruff format --check --diff .
    - name: Test with pytest
      run: |
        pytest --cov=internet_troubleshooter --cov-report=xml --cov-report=term
    - name: Coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false # optional (default = false)
        verbose: true # optional (default = false)

  types:
    name: types
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,html]"
    - name: Type check with mypy
      run: |
        mypy internet_troubleshooter

  build:
    name: build
    needs: [test, types]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require successful checks
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.types.result }}" != "success" ]; then
            echo "types job result: ${{ needs.types.result }}"
            exit 1
          fi
